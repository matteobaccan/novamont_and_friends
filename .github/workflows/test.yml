name: Test

# Le regole della lega sono aritmetica e i parser leggono pagine HTML: qui si
# controlla che nessuna delle due cose si sia rotta.
# I test non vanno in rete, quindi questo workflow non dipende da nessun sito.
# I file HTML per i test dei lettori non sono nel repo: se non presenti, i
# test non li validano.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: node --test
        run: node --test "test/**/*.test.mjs"
