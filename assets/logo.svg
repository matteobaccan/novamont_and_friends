<svg xmlns="http://www.w3.org/2000/svg" width="430" height="140" viewBox="0 0 172 56" role="img" aria-label="Novamont &amp; Friends">
  <title>Novamont &amp; Friends</title>

  <!-- Marchio del sito, in un file a sé perché il README di GitHub non esegue
       il CSS della pagina: qui stile e animazione viaggiano dentro l'SVG.
       Nessun riferimento esterno, nemmeno al font: un <img> non carica webfont,
       quindi il nome si appoggia ai caratteri di sistema. -->
  <style>
    .nome  { fill: #1f2937; font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    .coda  { fill: #1f2937; font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 15.5px; font-weight: 500; letter-spacing: 1.1px; opacity: 0.62; }

    /* GitHub in tema scuro segue l'impostazione di sistema: il nome si schiarisce,
       l'oro della coppa regge su entrambi i fondi e resta com'è */
    @media (prefers-color-scheme: dark) {
      .nome, .coda { fill: #f8fafc; }
    }

    .guscio { fill: rgba(244, 182, 10, 0.16); stroke: url(#oro-coppa); stroke-width: 2; stroke-linejoin: round; }
    .manico { fill: none; stroke: url(#oro-coppa); stroke-width: 2; stroke-linecap: round; }
    .corpo  { fill: url(#oro-coppa); }

    /* La coppa si riempie, resta piena a lungo e riparte: in un README non si
       arriva tutti nello stesso istante, e una posa breve la si perderebbe */
    .livello {
      fill: url(#oro-livello);
      animation: riempi 7s ease-out infinite;
    }

    @keyframes riempi {
      0%   { transform: translateY(24px); }
      14%  { transform: translateY(0); }
      88%  { transform: translateY(0); }
      100% { transform: translateY(24px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .livello { animation: none; transform: translateY(0); }
    }
  </style>

  <defs>
    <linearGradient id="oro-coppa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe994"/>
      <stop offset="0.45" stop-color="#f4b60a"/>
      <stop offset="1" stop-color="#c8870a"/>
    </linearGradient>
    <linearGradient id="oro-livello" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe071"/>
      <stop offset="1" stop-color="#f0a500"/>
    </linearGradient>
    <clipPath id="vasca">
      <path d="M14 9 H34 V15 C34 25 30 31 24 31 C18 31 14 25 14 15 Z"/>
    </clipPath>
  </defs>

  <path class="manico" d="M14 12 C7.5 12 5.5 14.5 5.5 17.5 C5.5 21.5 9 23.5 14.5 24"/>
  <path class="manico" d="M34 12 C40.5 12 42.5 14.5 42.5 17.5 C42.5 21.5 39 23.5 33.5 24"/>
  <path class="guscio" d="M14 9 H34 V15 C34 25 30 31 24 31 C18 31 14 25 14 15 Z"/>
  <g clip-path="url(#vasca)">
    <rect class="livello" x="12" y="8" width="24" height="24"/>
  </g>
  <path class="corpo" d="M22.4 31 h3.2 v5.4 h-3.2 z"/>
  <path class="corpo" d="M17.5 41 C17.5 37.8 20 36.4 24 36.4 C28 36.4 30.5 37.8 30.5 41 Z"/>
  <rect class="corpo" x="13.5" y="41" width="21" height="4.4" rx="1.6"/>

  <text class="nome" x="58" y="27">Novamont</text>
  <text class="coda" x="58.5" y="45">&amp; Friends</text>
</svg>
