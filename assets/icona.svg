<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Novamont &amp; Friends</title>
  <!-- Icona piena, usata per purpose "any" e per apple-touch-icon. Nessuna trasparenza: iOS rende nero tutto cio' che e' trasparente
       in un'icona, e Android ci mette sotto la sua maschera. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241f52"/>
      <stop offset="1" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe994"/>
      <stop offset="0.45" stop-color="#f4b60a"/>
      <stop offset="1" stop-color="#c8870a"/>
    </linearGradient>
    <linearGradient id="livello" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe071"/>
      <stop offset="1" stop-color="#f0a500"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <g transform="translate(61.4, 39.5) scale(8.1081)">
      <path fill="none" stroke="url(#oro)" stroke-width="2" stroke-linecap="round" d="M14 12 C7.5 12 5.5 14.5 5.5 17.5 C5.5 21.5 9 23.5 14.5 24"/>
    <path fill="none" stroke="url(#oro)" stroke-width="2" stroke-linecap="round" d="M34 12 C40.5 12 42.5 14.5 42.5 17.5 C42.5 21.5 39 23.5 33.5 24"/>
    <path fill="url(#livello)" stroke="url(#oro)" stroke-width="2" stroke-linejoin="round" d="M14 9 H34 V15 C34 25 30 31 24 31 C18 31 14 25 14 15 Z"/>
    <path fill="url(#oro)" d="M22.4 31 h3.2 v5.4 h-3.2 z"/>
    <path fill="url(#oro)" d="M17.5 41 C17.5 37.8 20 36.4 24 36.4 C28 36.4 30.5 37.8 30.5 41 Z"/>
    <rect fill="url(#oro)" x="13.5" y="41" width="21" height="4.4" rx="1.6"/>
  </g>
</svg>
